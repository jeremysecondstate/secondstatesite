<script>
    let isZoomed = false;
    let currentImageIndex = 0;
    let slideshowInterval = null;
    let imageSwapTimeout = null;
    let imageUrls = [];
    let isArrangingPhotos = false;

    const FADE_DURATION = 1111;
    const SLIDESHOW_DELAY = 6969;

    document.addEventListener("DOMContentLoaded", function () {
        const fullscreenImage = document.getElementById("fullscreenImage");
        const overlay = document.getElementById("fullscreenOverlay");
        const closeBtn = document.getElementById("closeFullscreenBtn");
        const photoEditor = document.querySelector(".artwork-photo-editor");

        syncPhotoOrder();

        if (photoEditor) {
            photoEditor.addEventListener("click", function (event) {
                const button = event.target.closest(".artwork-photo-select");
                if (!button || isArrangingPhotos) return;
                changeMainImage(button.querySelector(".thumbnail-img"));
            });
            photoEditor.addEventListener("order:start", function () {
                isArrangingPhotos = true;
                stopSlideshow();
                clearTimeout(imageSwapTimeout);
                const mainImage = document.getElementById("mainImage");
                if (mainImage) mainImage.classList.remove("fade-out");
                syncPhotoOrder();
            });
            photoEditor.addEventListener("order:change", function () {
                syncPhotoOrder();
            });
            photoEditor.addEventListener("order:finish", function () {
                isArrangingPhotos = false;
                syncPhotoOrder(false);
                restartSlideshow();
            });
        }

        if (imageUrls.length > 1) {
            startSlideshow();
        }

        fullscreenImage.addEventListener("click", function (event) {
            event.stopPropagation();

            isZoomed = !isZoomed;

            if (isZoomed) {
                fullscreenImage.style.transform = "scale(2.5)";
                fullscreenImage.classList.add("zoomed");
            } else {
                fullscreenImage.style.transform = "scale(1)";
                fullscreenImage.style.transformOrigin = "center center";
                fullscreenImage.classList.remove("zoomed");
            }
        });

        fullscreenImage.addEventListener("mousemove", function (event) {
            if (!isZoomed) return;

            const rect = fullscreenImage.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * 100;
            const y = ((event.clientY - rect.top) / rect.height) * 100;

            fullscreenImage.style.transformOrigin = `${x}% ${y}%`;
        });

        closeBtn.addEventListener("click", function (event) {
            event.stopPropagation();
            closeFullscreen();
        });

        overlay.addEventListener("click", function () {
            closeFullscreen();
        });
    });

    function syncPhotoOrder(preserveActive = true) {
        const mainImage = document.getElementById("mainImage");
        const activeUrl = preserveActive && mainImage ? mainImage.src : null;
        imageUrls = Array.from(document.querySelectorAll(".artwork-photo-editor .thumbnail-img")).map(img => img.src);
        currentImageIndex = Math.max(0, imageUrls.indexOf(activeUrl));
        if (!preserveActive && mainImage && imageUrls.length) {
            clearTimeout(imageSwapTimeout);
            mainImage.classList.remove("fade-out");
            mainImage.src = imageUrls[currentImageIndex];
        }
        updateActiveThumbnail();
    }

    function updateActiveThumbnail() {
        document.querySelectorAll(".artwork-photo-select").forEach((button, index) => {
            if (index === currentImageIndex) {
                button.setAttribute("aria-current", "true");
            } else {
                button.removeAttribute("aria-current");
            }
        });
    }

    function updateMainImage(index) {
        const mainImage = document.getElementById("mainImage");
        if (!mainImage || !imageUrls.length || isArrangingPhotos) return;

        currentImageIndex = (index + imageUrls.length) % imageUrls.length;
        updateActiveThumbnail();

        clearTimeout(imageSwapTimeout);
        mainImage.classList.add("fade-out");

        imageSwapTimeout = setTimeout(() => {
            mainImage.src = imageUrls[currentImageIndex];
            requestAnimationFrame(() => {
                mainImage.classList.remove("fade-out");
            });
        }, FADE_DURATION);
    }

    function changeMainImage(element) {
        if (!element || isArrangingPhotos) return;
        const foundIndex = imageUrls.indexOf(element.src);
        updateMainImage(foundIndex >= 0 ? foundIndex : 0);
        restartSlideshow();
    }

    function showNextImage(event) {
        event.stopPropagation();
        updateMainImage(currentImageIndex + 1);
        restartSlideshow();
    }

    function showPrevImage(event) {
        event.stopPropagation();
        updateMainImage(currentImageIndex - 1);
        restartSlideshow();
    }

    function startSlideshow() {
        stopSlideshow();
        if (isArrangingPhotos || imageUrls.length < 2) return;
        slideshowInterval = setInterval(() => {
            updateMainImage(currentImageIndex + 1);
        }, SLIDESHOW_DELAY);
    }

    function stopSlideshow() {
        if (slideshowInterval) {
            clearInterval(slideshowInterval);
            slideshowInterval = null;
        }
    }

    function restartSlideshow() {
        if (imageUrls.length > 1) {
            startSlideshow();
        }
    }

    function openFullscreen(imageElement) {
        const overlay = document.getElementById('fullscreenOverlay');
        const fullscreenImage = document.getElementById('fullscreenImage');

        fullscreenImage.src = imageElement.src;
        fullscreenImage.style.transform = "scale(1)";
        fullscreenImage.style.transformOrigin = "center center";
        fullscreenImage.classList.remove("zoomed");
        isZoomed = false;

        overlay.style.display = "flex";
    }

    function closeFullscreen() {
        const overlay = document.getElementById('fullscreenOverlay');
        const fullscreenImage = document.getElementById('fullscreenImage');

        overlay.style.display = "none";
        fullscreenImage.style.transform = "scale(1)";
        fullscreenImage.style.transformOrigin = "center center";
        fullscreenImage.classList.remove("zoomed");
        isZoomed = false;
    }
</script>

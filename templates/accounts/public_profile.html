{% extends "base.html" %}
{% block content %}
<section class="profile-page-shell">
  <section class="profile-hero-card profile-hero-card--public">
    <div class="profile-hero-card__backdrop"></div>
    <div class="profile-hero-card__content profile-hero-card__content--public">
      <div class="profile-avatar-wrap profile-avatar-wrap--hero">
        {% if profile_user.avatar %}
          <img src="{{ profile_user.avatar.url }}" alt="avatar" class="profile-avatar profile-avatar--hero">
        {% else %}
          <div class="profile-avatar profile-avatar--hero profile-avatar--placeholder">{{ profile_user.user.username|slice:":1"|upper }}</div>
        {% endif %}
      </div>
      <p class="account-eyebrow">SECONDSTATE PROFILE</p>
      <h1>{{ profile_user.public_name }}</h1>
      <p class="account-subtitle profile-account-handle">@{{ profile_user.user.username }}</p>
    </div>
  </section>
</section>
{% endblock %}
